name: Build and Deploy Angular App
on:
  push:
    branches:
      - main #Triggers the wf every time you push to the main branch

permissions:
  contents: write #Allows the runner to commit files to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build:prod

      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/project-deployment #the name on very first line of package json
          branch: gh-pages # THe branch where production code lives